<style>
/* Layout: one phone-width column, sticky page head, bottom tab bar; wider screens centre it. */
:root {
  --bg: #0c0c0d; --surface: #131315; --raised: #1a1a1d; --hover: #202024;
  --line: #2a2a2f; --line-soft: #1f1f23; --dash: #4a4a52;
  --fg: #ededed; --fg-2: #c4c4ca; --muted: #a1a1a7; --faint: #8a8a92;
  --primary-bg: #ededed; --primary-fg: #0c0c0d; --focus: #6ea8fe;
  --warn: #e08a4a; --danger: #d27a7a; --ok: #7cc192;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 8px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f4f2; --surface: #ffffff; --raised: #f7f7f5; --hover: #ececea;
    --line: #d9d9d5; --line-soft: #e8e8e5; --dash: #a3a3a8;
    --fg: #16161a; --fg-2: #2e2e34; --muted: #55555d; --faint: #62626a;
    --primary-bg: #1d2b4f; --primary-fg: #ffffff; --focus: #2f5bd3;
    --warn: #b25c17; --danger: #b0443c; --ok: #2c7a4b;
    --scrim: rgba(20, 20, 24, 0.45); --shadow: 0 8px 28px rgba(20, 20, 24, 0.16);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f4f2; --surface: #ffffff; --raised: #f7f7f5; --hover: #ececea;
  --line: #d9d9d5; --line-soft: #e8e8e5; --dash: #a3a3a8;
  --fg: #16161a; --fg-2: #2e2e34; --muted: #55555d; --faint: #62626a;
  --primary-bg: #1d2b4f; --primary-fg: #ffffff; --focus: #2f5bd3;
  --warn: #b25c17; --danger: #b0443c; --ok: #2c7a4b;
  --scrim: rgba(20, 20, 24, 0.45); --shadow: 0 8px 28px rgba(20, 20, 24, 0.16);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--font); font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.55; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.shell { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line-soft);
  padding-block: 8px 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head-row { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; min-width: 0; }
.head .aside { margin-left: auto; flex: 0 0 auto; }
.head-link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; font-size: 12px; font-weight: 500; color: var(--muted); background: transparent; border: 0; }
.back { width: 32px; height: 44px; margin-left: -8px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: 0 0 auto; }
.mark { min-width: 28px; height: 20px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; font-size: 10px; font-weight: 600; color: var(--muted); flex: 0 0 auto; }

.main { display: flex; flex-direction: column; gap: 20px; padding-block: 14px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.block { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.label { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.sublabel { font-size: 12px; color: var(--muted); }
.hint { margin: 0; font-size: 12px; color: var(--muted); }
.strong { font-weight: 600; color: var(--fg-2); }
.muted { color: var(--muted); }
.warn-text { color: var(--warn); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.input, .select, .textarea { width: 100%; min-height: 44px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); color: var(--fg); font-size: 13px; }
.select { padding: 0 10px; }
.textarea { padding: 10px 12px; line-height: 1.5; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--faint); }
.sheet .input, .sheet .select, .sheet .textarea { background: var(--bg); }

.seg { display: flex; gap: 3px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.sheet .seg { background: var(--bg); }
.seg button { flex: 1; min-width: 0; min-height: 44px; padding: 0 4px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--fg); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tiles button { min-height: 44px; padding: 0 4px; border-radius: var(--r); background: transparent; border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 500; }
.tiles button[aria-pressed="true"] { background: var(--hover); border-color: var(--fg); color: var(--fg); font-weight: 600; }

.wrapchips { display: flex; flex-wrap: wrap; gap: 6px; }
.wrapchips button { min-height: 40px; padding: 0 12px; display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--muted); background: transparent; border: 1px solid var(--line); }
.wrapchips button[aria-pressed="true"] { color: var(--fg); font-weight: 600; border-color: var(--fg); background: var(--hover); }
.wrapchips button.some { border-style: dashed; border-color: var(--dash); color: var(--fg-2); }

.btn { min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r); color: var(--fg); font-size: 13px; font-weight: 500; text-align: center; }
.btn-primary { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-fg); font-weight: 600; }
.btn-outline { background: transparent; }
.btn-danger { color: var(--danger); }
.btn-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pill-btn { flex: 0 0 auto; height: 44px; padding: 0 2px; background: transparent; border: 0; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--fg); border: 1px solid var(--line); background: var(--raised); white-space: nowrap; }
.pill.ghost { color: var(--muted); background: transparent; border-style: dashed; border-color: var(--dash); }
.pill.plain { color: var(--muted); background: transparent; border-color: transparent; }
.textlink { min-height: 44px; padding: 0; background: transparent; border: 0; color: var(--muted); font-size: 12px; font-weight: 500; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }

.card { display: flex; flex-direction: column; gap: 3px; width: 100%; padding: 10px 12px; min-height: 52px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); color: var(--fg); text-align: left; }
.card.quiet { background: transparent; }
.card .t { font-size: 13px; font-weight: 600; }
.card .s { font-size: 12px; color: var(--muted); }
.why { font-size: 12px; color: var(--muted); line-height: 1.45; }
.why.lead { color: var(--fg-2); font-weight: 500; }
.panel { padding: 12px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); display: flex; flex-direction: column; gap: 8px; }
.sheet .panel { background: var(--bg); }
.list { display: flex; flex-direction: column; }
.group { padding: 14px 0 2px; }
.lrow { display: flex; align-items: center; gap: 8px; min-height: 48px; border-bottom: 1px solid var(--line-soft); }
.lrow.retired { opacity: 0.72; }
.lrow.variant { padding-left: 16px; }
.lrow.variant .main-btn .t { font-weight: 500; }
.lrow .main-btn { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; padding: 8px 0; background: transparent; border: 0; color: var(--fg); text-align: left; }
.lrow .main-btn .t { font-size: 13px; font-weight: 600; }
.lrow .main-btn .s { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.empty { margin: 0; padding: 12px; font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); }
.versus { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr); align-items: end; gap: 4px; }
.swap { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--muted); }
.step { display: flex; align-items: center; min-height: 44px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); }
.step .name { flex: 1; min-width: 0; padding-left: 10px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--muted); flex: 0 0 auto; }
.join { height: 44px; padding: 0 2px 0 8px; background: transparent; border: 0; color: var(--muted); flex: 0 0 auto; }
.join span { display: inline-block; min-width: 34px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; font-weight: 500; text-align: center; }
.picker { display: flex; flex-direction: column; gap: 6px; padding: 4px 12px 8px; background: var(--bg); border: 1px solid var(--line-soft); border-radius: var(--r); }
.picker .item { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 0; background: transparent; border: 0; border-bottom: 1px solid var(--line-soft); color: var(--fg); text-align: left; width: 100%; }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 13px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
.check.plain { border-bottom: 0; }
.check input { width: 18px; height: 18px; accent-color: var(--fg); flex: 0 0 auto; }
.check .txt { display: flex; flex-direction: column; min-width: 0; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line-soft);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 2px 0 6px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; font-size: 11px; font-weight: 500; color: var(--muted); }
.tab[aria-current="page"] { color: var(--fg); font-weight: 600; }

.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); border: 0; width: 100%; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 14px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 12px 12px 0 0;
  padding-block: 0 calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.grab { align-self: center; width: 36px; height: 4px; margin-top: 8px; border-radius: 2px; background: var(--line); flex: 0 0 auto; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.sheet-head h2 { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; }
.close { width: 44px; height: 44px; margin-right: -12px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--muted); flex: 0 0 auto; }
.sheet-back { align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; min-height: 36px; margin: 0 0 -10px -6px; padding: 0 6px 0 0; background: transparent; border: 0; color: var(--muted); font-size: 12px; font-weight: 500; }

.toast-wrap { position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; justify-content: center; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast-wrap.top { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 10px); }
.toast { pointer-events: auto; width: 100%; max-width: 528px; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; min-height: 48px; border-radius: var(--r); background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 13px; font-weight: 500; color: var(--fg); }
.toast .msg { flex: 1; min-width: 0; padding: 6px 0; }
.toast.warn .msg { color: var(--warn); }
.toast .btn { min-height: 40px; }
.sheet-foot { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom, 0px)); margin-bottom: calc(-16px - env(safe-area-inset-bottom, 0px)); padding: 10px 0 calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line-soft); z-index: 1; }
.flag { display: inline-block; width: 26px; height: 14px; border-radius: 2px; object-fit: cover; vertical-align: -2px; box-shadow: 0 0 0 1px var(--line); flex: 0 0 auto; }
.flag.lg { width: 37px; height: 20px; vertical-align: -4px; }
.flags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding-top: 3px; }
.vs { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.civsel { position: relative; }
.civsel .flag { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.civsel .select { padding-left: 44px; }
.civsel .select.noflag { padding-left: 10px; }
.ms-btn { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); color: var(--fg); text-align: left; }
.ms-btn[aria-expanded="true"] { border-radius: var(--r) var(--r) 0 0; border-color: var(--fg); }
.ms-btn .sum { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; }
.ms-btn .chev { color: var(--muted); flex: 0 0 auto; font-size: 12px; font-weight: 600; display: inline-flex; }
.ms-list { max-height: 320px; overflow-y: auto; overscroll-behavior: contain; padding: 0 12px; background: var(--bg); border: 1px solid var(--fg); border-top: 0; border-radius: 0 0 var(--r) var(--r); margin-top: -7px; }
.ms-list .check { min-height: 44px; }
.ms-list .check:last-child { border-bottom: 0; }
.ms-list .group { padding: 10px 0 0; }
.btn-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.btn-row.three .btn { padding: 0 6px; font-size: 12px; }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.who { display: flex; gap: 3px; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); }
.who button { flex: 1; min-width: 0; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 500; }
.who button[aria-pressed="true"] { background: var(--hover); color: var(--fg); font-weight: 600; }
.lrow .time { flex: 0 0 auto; width: 48px; font-size: 12px; font-weight: 600; color: var(--fg-2); }
.lrow .lead-flag { flex: 0 0 auto; display: inline-flex; }
.ulink { text-decoration: underline; text-underline-offset: 2px; }
.tab { white-space: nowrap; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
</style>
</head>

<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Constants
// ---------------------------------------------------------------------------
const AGES = ['dark', 'feudal', 'castle', 'imperial'];
const AGE_NAME = { dark: 'Dark', feudal: 'Feudal', castle: 'Castle', imperial: 'Imperial' };
const DEF_TYPES = ['civs', 'mapTypes', 'maps', 'kinds', 'elements', 'strategies', 'features'];
const DEF_WORD = { elements: 'element', strategies: 'play', kinds: 'kind', features: 'map feature', maps: 'map', mapTypes: 'map type', civs: 'civ' };
const VIEWS = ['library', 'civs', 'maps', 'refs', 'check'];
const SOURCE_NAME = { youtube: 'YouTube', twitch_vod: 'Twitch', twitch_clip: 'Twitch', aoe4world: 'aoe4world', other: 'the site' };
const REF_KIND = { mine: 'My game', game: 'Other game', guide: 'Guide' };
const REF_TITLE = { mine: 'Your game', game: "Someone else's game", guide: 'Guide' };
const SHOWS = [['threat', 'Doing it'], ['response', 'Answering it'], ['both', 'Both']];
const OUTCOME = { worked: 'Worked', mixed: 'Mixed', failed: 'Failed' };
const PREP = { did_not_see: "Didn't see it", saw_no_plan: 'Saw it, no plan', plan_misexecuted: 'Had a plan, misplayed', handled: 'Handled it' };
const FLAG_FILES = new Set(['abbasid-dynasty', 'ayyubids', 'byzantines', 'chinese', 'delhi-sultanate', 'english', 'french', 'golden-horde', 'holy-roman-empire', 'house-of-lancaster', 'japanese', 'jeanne-darc', 'jin-dynasty', 'knights-templar', 'macedonian-dynasty', 'malians', 'mongols', 'order-of-the-dragon', 'ottomans', 'rus', 'scots', 'sengoku-daimyo', 'tughlaq-dynasty', 'vikings', 'zhu-xi-legacy']);
const ICON = {
  library: '<rect x="4" y="4" width="6" height="16" rx="1"></rect><rect x="14" y="4" width="6" height="16" rx="1"></rect>',
  civs: '<line x1="5" y1="21" x2="5" y2="4"></line><path d="M5 4h12l-2.5 4 2.5 4H5"></path>',
  maps: '<polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line>',
  check: '<line x1="4" y1="6" x2="14" y2="6"></line><line x1="4" y1="12" x2="14" y2="12"></line><line x1="4" y1="18" x2="10" y2="18"></line><polyline points="14 17 16.5 19.5 21 15"></polyline>',
  swap: '<polyline points="17 3 21 7 17 11"></polyline><line x1="21" y1="7" x2="9" y2="7"></line><polyline points="7 13 3 17 7 21"></polyline><line x1="3" y1="17" x2="15" y2="17"></line>',
  x: '<line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
  back: '<polyline points="15 18 9 12 15 6"></polyline>',
  refs: '<rect x="3" y="5" width="18" height="14" rx="2"></rect><polygon points="10 9 15 12 10 15 10 9"></polygon>',
  down: '<polyline points="6 9 12 15 18 9"></polyline>'
};
const svg = (name, size = 20, w = 1.8) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const S = {
  dbState: 'connecting',
  defsLoaded: false,
  defs: { civs: [], mapTypes: [], maps: [], kinds: [], elements: [], strategies: [], features: [] },
  games: {}, links: {}, tags: {}, answers: {}, changes: {}, settings: {},
  view: 'library', lastView: null,
  ui: {
    library: { seg: 'elements', showRetired: false },
    civs: { showRetired: false },
    civ: { showRetired: false },
    maps: { seg: 'maps', showRetired: false },
    check: { me: 'chinese', opp: 'ottomans', place: 'any:', seg: 'plays', showElsewhere: false },
    refs: { seg: 'all', url: '' }
  },
  sheet: null,
  toast: null,
  refDefaults: {}
};
const PREFS = 'matchup-library-prefs-v2';
function loadPrefs() {
  try {

    const res = await send({ label, writes, before });
    const ch = res.change;
    S.changes[ch.id] = { label: ch.label, at: ch.at, before };
    const ids = Object.keys(S.changes).sort();
    ids.slice(0, Math.max(0, ids.length - 30)).forEach((x) => { delete S.changes[x]; });
    showToast(toast || label + '.', false, ch.id);
    return ch.id;
  } catch (e) {
    await loadState(true);
    showToast("Couldn't save that. " + e.message, true);
    return null;
  }
}
async function undoLast() {
  const ids = Object.keys(S.changes).sort();
  const last = ids[ids.length - 1];
  if (!last) return;
  const ch = S.changes[last];
  const restore = ch.before || [];
  const current = restore.map((b) => ({ path: b.path, data: currentDoc(b.path) }));
  restore.forEach((b) => write(b.path, b.data));
  delete S.changes[last];
  try {
    await send({ writes: restore, before: current, undoOf: last });
    showToast('Undone: ' + lowerFirst(ch.label) + '.');
  } catch (e) {
    await loadState(true);
    showToast("Couldn't undo that. " + e.message, true);
  }
  render();
}
async function loadState(quiet) {
  try {
    const r = await fetch('/api/state', { credentials: 'same-origin', cache: 'no-store' });
    if (r.status === 401 || r.status === 403 || r.status === 503) {
      let out = {};
      try { out = await r.json(); } catch (e) { out = {}; }
      S.dbState = 'unauthorized';
      S.authError = out.error || '';
      render();
      return;
    }
    if (!r.ok) throw new Error('status ' + r.status);
    const st = await r.json();
    DEF_TYPES.forEach((t) => { S.defs[t] = (st.defs && st.defs[t]) || []; });
    S.games = st.games || {};
    S.links = st.links || {};
    S.tags = st.tags || {};
    S.answers = st.answers || {};
    S.changes = st.changes || {};
    S.settings = st.settings || {};
    S.defsLoaded = true;
    S.dbState = 'ready';
    S.loadedAt = Date.now();
  } catch (e) {
    if (S.dbState !== 'ready') S.dbState = 'unavailable';
    else if (!quiet) showToast("Couldn't refresh. Check your connection.", true);
  }
  render();
}
// Pick up changes made on another device when you come back to the page.
document.addEventListener('visibilitychange', () => {

function civTagWrites(field, id, civOn) {

  activeCivs().forEach((c) => {
    const mine = anyTags.filter((t) => t.civ === c.id);
    const live = mine.filter((t) => t.active !== false);
    const want = civOn.includes(c.id);
    if (want && !live.length) {
      const retired = mine.find((t) => !t.age);
      if (retired) writes.push({ path: 'tags/' + retired.id, data: { ...clone(S.tags[retired.id]), active: true } });
      else writes.push({ path: 'tags/' + newId(), data: newTag(c.id, field, id, { kind: 'any' }) });
      on += 1;
    } else if (!want && live.length) {
      live.forEach((t) => writes.push({ path: 'tags/' + t.id, data: { ...clone(S.tags[t.id]), active: false } }));

async function saveDef() {

  const dup = items.find((x) => x.id !== sh.id && x.name.toLowerCase() === name.toLowerCase());
  if (dup) { showToast(isActive(dup) ? 'There is already a ' + word + ' with that name.' : 'A retired ' + word + ' has that name. Restore it instead.', true); return; }
  let id = sh.id;
  if (!id) {
    const sep = t === 'maps' ? '-' : '_';
    const base = t === 'maps' ? slug(name).replace(/_/g, '-') : slug(name);
    id = base;
    let n = 2;
    while (items.some((x) => x.id === id)) { id = base + sep + n; n += 1; }
  }
  const prev = sh.id ? find(S.defs[t], sh.id) : null;
  const item = prev ? clone(prev) : { id, active: true };
  item.name = name;
  const extra = [];

  if (t === 'elements' || t === 'strategies') {
    if (t === 'elements') Object.assign(item, { kind: d.kind, ages: AGES.filter((a) => d.ages.includes(a)), description: d.description.trim(), tells: d.tells.trim() });
    else {
      const steps = builderToSteps(d.builder);
      if (!steps.length) { showToast('Add at least one element to the play.', true); return; }
      const twin = S.defs.strategies.find((s) => s.id !== sh.id && isActive(s) && signature(s.steps) === signature(steps));
      if (twin) { showToast('Same steps as ' + twin.name + '. Edit that play instead, or change the steps.', true); return; }
      const oldNotes = {};
      (prev ? prev.steps : []).forEach((s) => { oldNotes[s.el + '@' + s.step] = s.notes; });
      Object.assign(item, { description: d.description.trim(), steps: steps.map((s) => ({ ...s, notes: oldNotes[s.el + '@' + s.step] || '' })), notes: prev ? prev.notes || '' : '', mergedInto: prev ? prev.mergedInto || null : null });
    }
    item.where = d.where;
    item.whereNote = d.where.length ? d.whereNote.trim() : '';
    const r = civTagWrites(t === 'elements' ? 'el' : 'play', id, d.civOn);
    extra.push(...r.writes);
    if (r.on || r.off) tagNote = ' ' + [r.on ? 'Tagged ' + plural(r.on, 'civ') : '', r.off ? (r.on ? 'untagged ' : 'Untagged ') + plural(r.off, 'civ') : ''].filter(Boolean).join(', ') + '.';
  } else if (t === 'features') {
    item.description = d.description.trim();
    const maps = clone(S.defs.maps);
    let changed = false;
    maps.forEach((m) => {
      const want = d.mapsOn.includes(m.id);
      const has = (m.features || []).includes(id);
      if (want && !has) { m.features = [...(m.features || []), id]; changed = true; }
      if (!want && has) { m.features = m.features.filter((f) => f !== id); changed = true; }
    });
    if (changed) extra.push({ path: 'defs/maps', data: { items: maps } });
  } else if (t === 'maps') {
    Object.assign(item, { type: d.type, features: d.features, inPool: !!d.inPool, notes: d.notes.trim() });

  } else {

  }

  S.sheet = null;
  await commit((prev ? 'Edited ' : 'Added ') + name, [{ path: 'defs/' + t, data: { items: next } }, ...extra], (prev ? 'Saved ' : 'Added ') + name + '.' + tagNote);

}

    <button type="button" class="btn btn-primary" data-act="mg-do" data-keep="${esc(keep)}">Keep ${esc(playTitle(keep))} and merge</button>`;

async function doMerge(keepId) {
  const group = health().dupes.find((g) => g.some((s) => s.id === keepId));
  if (!group) return;
  const gone = group.filter((s) => s.id !== keepId).map((s) => s.id);
  const writes = [{ path: 'defs/strategies', data: { items: clone(S.defs.strategies).map((s) => (gone.includes(s.id) ? { ...s, active: false, mergedInto: keepId } : s)) } }];
  let moved = 0;
  Object.entries(S.games).forEach(([gid, g]) => {
    if (!(g.plays || []).some((p) => gone.includes(p.strategyId))) return;
    const next = clone(g);
    next.plays.forEach((p) => { if (gone.includes(p.strategyId)) { p.strategyId = keepId; moved += 1; } });
    writes.push({ path: 'games/' + gid, data: next });
  });
  Object.entries(S.tags).forEach(([tid, t]) => { if (gone.includes(t.play)) { writes.push({ path: 'tags/' + tid, data: { ...clone(t), play: keepId } }); moved += 1; } });
  Object.entries(S.answers).forEach(([aid, a]) => { if (gone.includes(a.strategyId)) writes.push({ path: 'answers/' + aid, data: { ...clone(a), strategyId: keepId } }); });
  Object.entries(S.links).forEach(([lid, l]) => {
    if (!(l.marks || []).some((m) => gone.includes(m.strategyId))) return;
    const next = clone(l);
    next.marks.forEach((m) => { if (gone.includes(m.strategyId)) m.strategyId = keepId; });
    writes.push({ path: 'links/' + lid, data: next });
  });
  S.sheet = null;
  await commit('Merged ' + gone.map(playTitle).join(', ') + ' into ' + playTitle(keepId), writes, 'Merged. ' + plural(moved, 'game or tag', 'games and tags') + ' moved to ' + playTitle(keepId) + '.');
  render();
}

  if (d.refKind === 'game') {
    const g = clone(S.games[d.gameId]);
    title = refTitleGame(g);
    g.plays = g.plays || [];
    const pid = d.pid || newId();
    const i = g.plays.findIndex((p) => p.pid === pid);
    const old = i >= 0 ? g.plays[i] : {};
    const play = { ...old, pid, runBy: d.side, strategyId: tgt.strategyId, elementId: tgt.elementId, age: tgt.age, outcome: d.outcome || null, prep: g.mine && d.side === 'opponent' ? d.prep || null : null, answerId: old.answerId || null, did: (d.did || '').trim(), notes: (d.note || '').trim() };
    if (i >= 0) g.plays[i] = play; else g.plays.push(play);
    writes.push({ path: 'games/' + d.gameId, data: g });
    const link = mainLink(d.gameId);
    if (link && timed(link)) {
      const lk = clone(S.links[link.id]);
      const had = (lk.marks || []).some((m) => m.playId === pid);
      if (had || at != null) {
        lk.marks = (lk.marks || []).filter((m) => m.playId !== pid);
        if (at != null) lk.marks.push({ mid: newId(), at, playId: pid, civ: null, elementId: null, strategyId: null, age: null, shows: 'both', note: '' });
        writes.push({ path: 'links/' + link.id, data: lk });
      }
    }
    S.lastSide = d.side;
  } else {
    const lk = clone(S.links[d.linkId]);
    title = guideTitle(lk);
    lk.marks = lk.marks || [];
    const mid = d.mid || newId();
    const mark = { mid, at, playId: null, civ: d.civ || null, elementId: tgt.elementId, strategyId: tgt.strategyId, age: tgt.age, shows: d.shows || 'threat', note: (d.note || '').trim() };
    const i = lk.marks.findIndex((m) => m.mid === mid);
    if (i >= 0) lk.marks[i] = mark; else lk.marks.push(mark);
    writes.push({ path: 'links/' + d.linkId, data: lk });
  }
  const what = tgt.strategyId ? tgt.name || playTitle(tgt.strategyId) : elName(tgt.elementId);
  const editing = !!(d.pid || d.mid);
  S.sheet = again ? { kind: 'moment', draft: blankMoment(d), picking: true, sid: ++sheetSeq } : null;
  await commit((editing ? 'Edited a moment in ' : 'Added ' + what + ' to ') + title, writes, (editing ? 'Saved the moment.' : 'Added ' + what + '.') + (tgt.created ? ' New play added to Library.' : ''));
  render();
}
async function deleteMoment() {
  const d = S.sheet.draft;
  const writes = [];
  let title;
  if (d.refKind === 'game') {
    const g = clone(S.games[d.gameId]);
    title = refTitleGame(g);
    g.plays = (g.plays || []).filter((p) => p.pid !== d.pid);
    writes.push({ path: 'games/' + d.gameId, data: g });
    gameLinks(d.gameId).forEach((l) => { if ((l.marks || []).some((m) => m.playId === d.pid)) writes.push({ path: 'links/' + l.id, data: { ...clone(S.links[l.id]), marks: l.marks.filter((m) => m.playId !== d.pid) } }); });
  } else {
    const lk = clone(S.links[d.linkId]);
    title = guideTitle(lk);
    lk.marks = (lk.marks || []).filter((m) => m.mid !== d.mid);
    writes.push({ path: 'links/' + d.linkId, data: lk });
  }
  S.sheet = null;
  await commit('Deleted a moment from ' + title, writes, 'Moment deleted.');
  render();
}

// ---------------------------------------------------------------------------
// Sheets
// ---------------------------------------------------------------------------
function sheetHtml() {
  const k = S.sheet.kind;
  const inner = k === 'def' ? sheetDef() : k === 'tag' ? sheetTag() : k === 'bulk' ? sheetBulk() : k === 'why' ? sheetWhy() : k === 'upkeep' ? sheetUpkeep() : k === 'merge' ? sheetMerge() : k === 'refdet' ? sheetRefDetails() : k === 'moment' ? sheetMoment() : '';
  if (!inner) return '';
  return `<button type="button" class="scrim" data-act="sheet-close" aria-label="Close"></button><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><span class="grab" aria-hidden="true"></span>${inner}</div>`;
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
function setPath(path, value) {
  const parts = path.split('.');
  let o = parts[0] === 'sheet' ? S.sheet : S;
  if (!o) return;
  for (let i = parts[0] === 'sheet' ? 1 : 0; i < parts.length - 1; i += 1) {
    if (o[parts[i]] == null) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length - 1]] = value;
}
const draft = () => (S.sheet ? S.sheet.draft : null);
const toggleIn = (list, v) => (list.includes(v) ? list.filter((x) => x !== v) : [...list, v]);
const A = {
  'sheet-close': () => { S.sheet = null; render(); },
  'sheet-back': () => { S.sheet = S.sheet && S.sheet.back ? S.sheet.back : null; render(); },
  'toast-undo': () => {
    const ids = Object.keys(S.changes).sort();
    if (S.toast && ids[ids.length - 1] === S.toast.undoId) return undoLast();
    showToast('Other changes came after that one. Undo them from Upkeep, newest first.', true);
  },
  upkeep: () => openSheet({ kind: 'upkeep' }),
  'up-undo': () => undoLast(),
  'up-merge': () => openSheet({ kind: 'merge', keep: null, back: S.sheet }),
  'mg-keep': (ds) => { S.sheet.keep = ds.id; render(); },
  'mg-do': (ds) => doMerge(ds.keep),
  'up-export': async () => {
    if (!downloads) return;
    const data = { exportedAt: new Date().toISOString(), defs: S.defs, tags: S.tags, games: S.games, links: S.links, answers: S.answers, settings: S.settings };
    try { await downloads.save({ filename: 'matchup-library-' + new Date().toISOString().slice(0, 10) + '.json', data: JSON.stringify(data, null, 2) }); showToast('Saved a copy.'); }
    catch (e) { if (e && e.code !== 'declined') showToast("Couldn't save the file here.", true); }
  },
  // Definitions
  'lib-seg': (ds) => { S.ui.library.seg = ds.v; render(); },
  'lib-retired': () => { S.ui.library.showRetired = !S.ui.library.showRetired; render(); },
  'maps-seg': (ds) => { S.ui.maps.seg = ds.v; render(); },
  'maps-retired': () => { S.ui.maps.showRetired = !S.ui.maps.showRetired; render(); },
  'civs-retired': () => { S.ui.civs.showRetired = !S.ui.civs.showRetired; render(); },
  'df-open': (ds) => openDef(ds.type, ds.id),
  'df-new': (ds) => openDef(ds.type, null),
  'df-restore': (ds) => toggleDefActive(ds.type, ds.id),
  'df-secondary': () => toggleDefActive(S.sheet.type, S.sheet.id),
  'df-save': () => saveDef(),
  'df-age': (ds) => { const d = draft(); const next = AGES.filter((a) => (a === ds.v ? !d.ages.includes(a) : d.ages.includes(a))); if (!next.length) { showToast('Keep at least one age on.', true); return; } d.ages = next; render(); },
  'df-civ': (ds) => { const d = draft(); d.civOn = toggleIn(d.civOn, ds.v); render(); },
  'df-map': (ds) => { const d = draft(); d.mapsOn = toggleIn(d.mapsOn, ds.v); render(); },
  'df-feature': (ds) => { const d = draft(); d.features = toggleIn(d.features, ds.v); render(); },
  'wh-show': () => { draft().showWhere = true; render(); },
  'wh-toggle': (ds) => { const d = draft(); const i = d.where.findIndex((p) => p.kind === ds.k && p.id === ds.v); if (i >= 0) d.where.splice(i, 1); else d.where.push({ kind: ds.k, id: ds.v }); render(); },
  'pb-pick': () => { S.sheet.picking = !S.sheet.picking; render(); },
  'pb-add': (ds) => {
    const b = draft().builder; const ages = elAges(ds.id); const prev = b[b.length - 1];
    let age = null;
    if (ages.length === 1) age = ages[0]; else if (prev && prev.age && ages.includes(prev.age)) age = prev.age;
    b.push({ el: ds.id, age, join: false });
    S.sheet.picking = false; render();
  },
  'pb-join': (ds) => { const b = draft().builder[Number(ds.i)]; b.join = !b.join; render(); },
  'pb-age': (ds) => { const b = draft().builder[Number(ds.i)]; const opts = [null, ...elAges(b.el)]; b.age = opts[(opts.indexOf(b.age) + 1) % opts.length]; render(); },
  'pb-remove': (ds) => { draft().builder.splice(Number(ds.i), 1); render(); },
  // Civ page and tags
  'cv-edit': () => openDef('civs', civIdFromView()),
  'cv-bulk': () => openSheet({ kind: 'bulk', draft: { civ: civIdFromView(), seg: 'el', place: { kind: 'any' }, pickedEl: [], pickedPlay: [] } }),
  'bk-seg': (ds) => { draft().seg = ds.v; render(); },
  'bk-save': () => saveBulk(),
  'cv-tag': (ds) => openTagSheet({ tagId: ds.id }),
  'cv-tag-new': (ds) => openTagSheet({ civ: civIdFromView(), field: ds.field, id: ds.id, place: { kind: 'any' } }),
  'cv-retired': () => { S.ui.civ.showRetired = !S.ui.civ.showRetired; render(); },
  'cv-restore': async (ds) => { const t = S.tags[ds.id]; await commit('Restored the ' + civName(t.civ) + ' ' + tagTargetName(t) + ' tag', [{ path: 'tags/' + ds.id, data: { ...clone(t), active: true } }]); render(); },
  'cv-copy-parent': () => copyFromParent(civIdFromView()),
  'cv-to-check': (ds) => { S.ui.check.opp = ds.civ; if (S.ui.check.seg === 'mine') S.ui.check.seg = 'plays'; savePrefs(); },
  'pl-kind': (ds) => { const d = draft(); if (d.place.kind === ds.v) return; d.place = ds.v === 'any' ? { kind: 'any' } : { kind: ds.v, id: firstIdFor(ds.v) }; render(); },
  'tg-age': (ds) => { draft().age = ds.v || null; render(); },
  'tg-save': () => saveTag(),
  'tg-secondary': async () => {
    const sh = S.sheet; const d = sh.draft;
    if (!d.tagId) { S.sheet = sh.back; render(); return; }
    const t = S.tags[d.tagId];
    S.sheet = sh.back;
    await commit('Retired the ' + civName(t.civ) + ' ' + tagTargetName(t) + ' tag', [{ path: 'tags/' + d.tagId, data: { ...clone(t), active: false } }], 'Tag retired. It waits under Retired tags on the civ page.');
    render();
  },
  // Dropdown checklists
  'ms-open': (ds) => { S.sheet.open = S.sheet.open === ds.key ? null : ds.key; render(); },
  // References
  'rf-seg': (ds) => { S.ui.refs.seg = ds.v; render(); },
  'rf-new': (ds) => openRefDetails(ds.kind, null),
  'rf-edit': () => openRefDetails(null, refFromView()),
  'rd-result': (ds) => { const d = draft(); d.result = d.result === ds.v ? '' : ds.v; render(); },
  'rd-save': () => saveRefDetails(),
  'rd-secondary': () => { if (draft().id) return deleteRef(); S.sheet = null; render(); },
  'mo-new': () => openMoment(null),
  'mo-open': (ds) => openMoment(ds.key),
  'mo-side': (ds) => { draft().side = ds.v; render(); },
  'mo-how': () => { draft().showHow = true; render(); },
  'mo-outcome': (ds) => { const d = draft(); d.outcome = d.outcome === ds.v ? null : ds.v; render(); },
  'mo-prep': (ds) => { const d = draft(); d.prep = d.prep === ds.v ? null : ds.v; render(); },
  'mo-shows': (ds) => { draft().shows = ds.v; render(); },
  'mo-save': (ds) => saveMoment(!!ds.again),
  'mo-delete': () => deleteMoment(),
  // Check
  'ck-seg': (ds) => { S.ui.check.seg = ds.v; savePrefs(); render(); },
  'ck-swap': () => { const u = S.ui.check; [u.me, u.opp] = [u.opp, u.me]; savePrefs(); render(); },
  'ck-elsewhere': () => { S.ui.check.showElsewhere = !S.ui.check.showElsewhere; render(); },
  'ck-open': (ds) => openSheet({ kind: 'why', itemKind: ds.kind, id: ds.id, civ: ds.civ }),
  'ck-tag': (ds) => openTagSheet({ tagId: ds.id }),
  'why-tag': (ds) => openTagSheet({ tagId: ds.id }, S.sheet),
  'why-new-tag': () => { const sh = S.sheet; const vp = parsePlace(S.ui.check.place); openTagSheet({ civ: sh.civ, field: sh.itemKind === 'play' ? 'play' : 'el', id: sh.id, place: vp }, sh); }
};
const AC = {
  'ms-pick': (t) => {
    const d = draft(); const key = t.dataset.key; const v = t.value;
    if (key === 'where') {
      const i = d.where.findIndex((x) => placeKey(x) === v);
      if (t.checked && i < 0) d.where.push(parsePlace(v));
      if (!t.checked && i >= 0) d.where.splice(i, 1);
    } else d[key] = t.checked ? [...new Set([...(d[key] || []), v])] : (d[key] || []).filter((x) => x !== v);
    render();
  },
  'pl-id': (t) => { draft().place.id = t.value; render(); },
  'wh-add-map': (t) => { if (t.value) { draft().where.push({ kind: 'map', id: t.value }); render(); } },
  'bk-pick': (t) => { const d = draft(); const key = d.seg === 'el' ? 'pickedEl' : 'pickedPlay'; d[key] = t.checked ? [...new Set([...d[key], t.value])] : d[key].filter((x) => x !== t.value); render(); }
};

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const fn = A[t.dataset.act];
  if (!fn) return;
  if (t.tagName !== 'A') e.preventDefault();
  Promise.resolve(fn(t.dataset, t)).catch(() => showToast('Something went wrong. Try again.', true));
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t.dataset || !t.dataset.bind) return;
  setPath(t.dataset.bind, t.type === 'checkbox' ? t.checked : t.value);
  if (t.dataset.hint) { const h = document.getElementById(t.dataset.hint); if (h) h.textContent = linkHint(t.value); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (!t.dataset) return;
  if (t.dataset.bind) {
    setPath(t.dataset.bind, t.type === 'checkbox' ? t.checked : t.value);
    if (t.dataset.bind.startsWith('ui.check')) savePrefs();
    if (t.dataset.rerender) render();
  }
  if (t.dataset.actChange && AC[t.dataset.actChange]) AC[t.dataset.actChange](t);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.sheet) { S.sheet = S.sheet.back || null; render(); }
});
function route() {
  const h = (location.hash || '').replace(/^#/, '');
  const ok = (v) => !!v && (VIEWS.includes(v) || v.startsWith('civ-') || v.startsWith('ref-'));
  S.view = ok(h) ? h : ok(S.lastView) ? S.lastView : 'library';
  S.sheet = null;
  if (!(S.toast && Date.now() - S.toast.at < 1500)) S.toast = null;
  savePrefs();
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

loadPrefs();
route();
loadState();
})();
</script>
